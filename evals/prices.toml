# USD per million tokens, as the provider lists them. Each row records where
# and when it was read so a cost claim can be re-checked. Cost per 1,000 calls
# = (prompt_mean * input + completion_mean * output) / 1e6 * 1000 at a run's
# mean token split; completion tokens include hidden reasoning tokens.

[models."openai/gpt-5-mini"]
